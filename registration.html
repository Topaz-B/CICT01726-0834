<!DOCTYPE html>
<html lang "en">
<head>
<meta charset="UTF-8">
<meta name="viewpoint" content="width=device-width, initial-scale=1.0">
<title> Registration Form</title>  
</head>
  <body>

<h1> Student Registration Form</h1>

<form action="#" method="post">
<label for="fullname">Full Name:</label><br>
 <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

  <label for="admission">Admission Number:</label><br>
  <input type="text" id="admission" name="admission" placeholder="Enter your admission number" required><br><br>

  <label for="email">Email Address:</label><br>
  <input type="email" id="email" name="email" placeholder="Enter your email address" required><br><br>

  <label for="phone">Phone Number:</label><br>
  <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10,15}" required><br><br>

  <label>Gender:</label><br>
  <input type="radio" id="male" name="gender" value="Male" required>
  <label for="male">Male</label>

  <input type="radio" id="female" name="gender" value="Female">
  <label for="female">Female</label>

  <input type="radio" id="other" name="gender" value="Other">
  <label for="other">Other</label><br><br>

  <label for="dob">Date of Birth:</label><br>
  <input type="date" id="dob" name="dob" required><br><br>

  <label for="course">Course:</label><br>
  <select id="course" name="course" required>
    <option value="">-- Select a course --</option>
    <option value="Computer Science">Computer Science</option>
    <option value="Information Technology">Information Technology</option>
    <option value="Business Administration">Business Administration</option>
    <option value="Engineering">Engineering</option>
    <option value="Nursing">Nursing</option>
    <option value="Education">Education</option>
  </select><br><br>

  <label for="password">Password:</label><br>
  <input type="password" id="password" name="password" placeholder="Enter a password" minlength="8" required><br><br>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">

</form>

</body>
</html>
